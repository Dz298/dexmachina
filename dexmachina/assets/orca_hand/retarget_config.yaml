# Retargeting configuration for Orca Hand
# Maps robot fingertip links to MANO human hand keypoints
# MANO keypoint indices: 16=thumb_tip, 17=index_tip, 18=middle_tip, 19=ring_tip, 20=pinky_tip

low_pass_alpha: 0.6
scaling_factor: 1.2  # Adjust based on hand size relative to human hand

left:
  urdf_path: orcahand_left_6dof.urdf
  target_origin_link: "left_palm"
  human_origin_idx: 0  # Wrist keypoint
  target_finger_links:
    - "left_thumb_fingertip"
    - "left_index_fingertip"
    - "left_middle_fingertip"
    - "left_ring_fingertip"
    - "left_pinky_fingertip"
  human_finger_idxs: [16, 17, 18, 19, 20]
  target_joint_names:
    # Wrist 6-DoF joints (added by add_wrist_dof)
    - 'L_forearm_tx_link_joint'
    - 'L_forearm_ty_link_joint'
    - 'L_forearm_tz_link_joint'
    - 'L_forearm_roll_link_joint'
    - 'L_forearm_pitch_link_joint'
    - 'L_forearm_yaw_link_joint'
    # Thumb joints
    - 'left_thumb_mcp'
    - 'left_thumb_abd'
    - 'left_thumb_pip'
    - 'left_thumb_dip'
    # Index finger joints
    - 'left_index_abd'
    - 'left_index_mcp'
    - 'left_index_pip'
    # Middle finger joints
    - 'left_middle_abd'
    - 'left_middle_mcp'
    - 'left_middle_pip'
    # Ring finger joints
    - 'left_ring_abd'
    - 'left_ring_mcp'
    - 'left_ring_pip'
    # Pinky finger joints
    - 'left_pinky_abd'
    - 'left_pinky_mcp'
    - 'left_pinky_pip'
  wrist_body: "left_palm"

right:
  urdf_path: orcahand_right_6dof.urdf
  target_origin_link: "right_palm"
  human_origin_idx: 0
  target_finger_links:
    - "right_thumb_fingertip"
    - "right_index_fingertip"
    - "right_middle_fingertip"
    - "right_ring_fingertip"
    - "right_pinky_fingertip"
  human_finger_idxs: [16, 17, 18, 19, 20]
  target_joint_names:
    # Wrist 6-DoF joints
    - 'R_forearm_tx_link_joint'
    - 'R_forearm_ty_link_joint'
    - 'R_forearm_tz_link_joint'
    - 'R_forearm_roll_link_joint'
    - 'R_forearm_pitch_link_joint'
    - 'R_forearm_yaw_link_joint'
    # Thumb joints
    - 'right_thumb_mcp'
    - 'right_thumb_abd'
    - 'right_thumb_pip'
    - 'right_thumb_dip'
    # Index finger joints
    - 'right_index_abd'
    - 'right_index_mcp'
    - 'right_index_pip'
    # Middle finger joints
    - 'right_middle_abd'
    - 'right_middle_mcp'
    - 'right_middle_pip'
    # Ring finger joints
    - 'right_ring_abd'
    - 'right_ring_mcp'
    - 'right_ring_pip'
    # Pinky finger joints
    - 'right_pinky_abd'
    - 'right_pinky_mcp'
    - 'right_pinky_pip'
  wrist_body: "right_palm"

